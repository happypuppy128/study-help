name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true  # 关键：自动同意SDK许可协议
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools

      # ===== 删除原来多余的 Install Android SDK packages 这一步！=====

      - name: Verify project files
        run: |
          test -f settings.gradle.kts || { echo "ERROR: settings.gradle.kts is missing from repository root."; exit 1; }
          test -f build.gradle.kts || { echo "ERROR: build.gradle.kts is missing from repository root."; exit 1; }
          test -f app/build.gradle.kts || { echo "ERROR: app/build.gradle.kts is missing. Check that the app folder was uploaded."; exit 1; }
          test -d app/src || { echo "ERROR: app/src is missing."; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xuexi-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
